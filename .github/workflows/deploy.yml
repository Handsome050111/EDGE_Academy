name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check syntax of all server JS files
        run: |
          find server -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node -c

  deploy:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
            cd ${{ secrets.SERVER_PATH }} &&
            git pull origin main &&
            cd server &&
            LD_LIBRARY_PATH=/var/www/vhosts/app.technonex.de/local-libs/extracted/usr/lib/x86_64-linux-gnu /var/www/vhosts/app.technonex.de/.npm-global/lib/node_modules/pm2/bin/pm2 restart nexacademy-backend --update-env
          '
